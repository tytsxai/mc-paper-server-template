common:
  header: ==========[ AuthMeReloaded 帮助 ]==========
  optional: 可选
  hasPermission: 你拥有权限
  noPermission: 无权限
  default: 默认
  result: 结果
  defaultPermissions:
    notAllowed: 无权限
    opOnly: 仅限管理员
    allowed: 所有人可用
section:
  command: 命令
  description: 简短描述
  detailedDescription: 详细描述
  arguments: 参数
  alternatives: 别名
  permissions: 权限
  children: 子命令
commands:
  authme:
    description: AuthMe 管理员命令
    detailedDescription: AuthMeReloaded 主命令。所有管理员命令的根命令。
  authme.register:
    description: 注册玩家
    detailedDescription: 为指定玩家注册指定的密码。
    arg1:
      label: 玩家
      description: 玩家名称
    arg2:
      label: 密码
      description: 密码
  authme.unregister:
    description: 注销玩家
    detailedDescription: 注销指定的玩家。
    arg1:
      label: 玩家
      description: 玩家名称
  authme.forcelogin:
    description: 强制玩家登录
    detailedDescription: 强制指定玩家登录。
    arg1:
      label: 玩家
      description: 在线玩家名称
  authme.password:
    description: 修改玩家密码
    detailedDescription: 修改玩家的密码。
    arg1:
      label: 玩家
      description: 玩家名称
    arg2:
      label: 密码
      description: 新密码
  authme.lastlogin:
    description: 玩家最后登录时间
    detailedDescription: 查看指定玩家最后登录的日期。
    arg1:
      label: 玩家
      description: 玩家名称
  authme.accounts:
    description: 显示玩家账户
    detailedDescription: 通过玩家名称或IP显示玩家的所有账户。
    arg1:
      label: 玩家
      description: 玩家名称或IP
  authme.email:
    description: 显示玩家邮箱
    detailedDescription: 显示指定玩家的邮箱地址（如果已设置）。
    arg1:
      label: 玩家
      description: 玩家名称
  authme.setemail:
    description: 修改玩家邮箱
    detailedDescription: 修改指定玩家的邮箱地址。
    arg1:
      label: 玩家
      description: 玩家名称
    arg2:
      label: 邮箱
      description: 玩家邮箱
