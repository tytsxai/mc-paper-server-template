    description: 设置首次出生点
    detailedDescription: 将玩家的首次出生点设置为你当前的位置。
  authme.purge:
    description: 清除旧数据
    detailedDescription: 清除指定天数之前的旧 AuthMeReloaded 数据。
    arg1:
      label: 天数
      description: 天数
  authme.purgeplayer:
    description: 清除单个玩家的数据
    detailedDescription: 清除指定玩家的数据。
    arg1:
      label: 玩家
      description: 要清除的玩家
    arg2:
      label: 选项
      description: 使用 'force' 强制执行而不检查玩家是否已注册
  authme.backup:
    description: 执行备份
    detailedDescription: 创建已注册用户的备份。
  authme.resetpos:
    description: 清除玩家的最后位置
    detailedDescription: 清除指定玩家或所有玩家的最后已知位置。
    arg1:
      label: 玩家/*
      description: 玩家名称或 * 表示所有玩家
  authme.purgebannedplayers:
    description: 清除被封禁玩家的数据
    detailedDescription: 清除所有被封禁玩家的 AuthMeReloaded 数据。
