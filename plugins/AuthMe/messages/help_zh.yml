    description: 获取玩家IP
    detailedDescription: 获取指定在线玩家的IP地址。
    arg1:
      label: 玩家
      description: 玩家名称
  authme.totp:
    description: 查看玩家是否启用了双因素认证
    detailedDescription: 返回指定玩家是否启用了双因素认证。
    arg1:
      label: 玩家
      description: 玩家名称
  authme.disabletotp:
    description: 删除玩家的双因素认证令牌
    detailedDescription: 为玩家禁用双因素认证。
    arg1:
      label: 玩家
      description: 玩家名称
  authme.spawn:
    description: 传送到出生点
    detailedDescription: 传送到出生点。
  authme.setspawn:
    description: 设置出生点
    detailedDescription: 将玩家的出生点设置为你当前的位置。
  authme.firstspawn:
    description: 传送到首次出生点
    detailedDescription: 传送到首次出生点。
