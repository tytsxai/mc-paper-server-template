# Essentials 套装配置文件
#
# 套装格式:
# kits:
#   套装名称:
#     delay: 延迟时间（秒）
#     items:
#       - 物品

kits:
  # 新手欢迎套装 - 最基础的生存物资
  welcome:
    delay: -1  # -1 表示只能领取一次
    items:
      # 最基础的工具（只给必需的）
      - WOODEN_PICKAXE 1
      - WOODEN_AXE 1
      # 少量食物（避免一开始饿死）
      - BREAD 4
      # 最少建材（鼓励玩家自己采集）
      - OAK_LOG 8
      - TORCH 8
      # 欢迎书籍
      - WRITTEN_BOOK 1 name:&6&l新手指南 lore:&7欢迎来到服务器！|&7这本书包含了所有你需要知道的信息|&7|&3QQ群:_539136479

  # 每日签到套装 - 基础补给（无贵重物品）
  daily:
    delay: 86400  # 24小时
    items:
      # 只给基础食物和材料，不给钻石、金苹果等贵重物品
      - BREAD 8
      - COAL 16
      - ARROW 8

  # 基础工具套装（每周一次）- 降低到石制工具
  tools:
    delay: 604800  # 7天
    items:
      # 改为石制工具，不给铁制工具
      - STONE_PICKAXE 1
      - STONE_AXE 1
      - STONE_SHOVEL 1
