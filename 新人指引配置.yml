# ====================================
# 新人指引系统配置文件
# ====================================
# 本配置文件用于管理新玩家的教学引导系统
# 确保玩家能够快速了解服务器的基本功能

# 新人指引配置
newbie_guide:
  # 是否启用新人指引系统
  enabled: true

  # 新人指引消息延迟（秒）
  # 每条消息之间的间隔时间
  message_delay: 10

  # 欢迎消息序列
  # 玩家首次加入时会按顺序收到这些消息
  welcome_messages:
    - message: "&6&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      delay: 0
    - message: "&a&l✦ 欢迎来到我们的 Minecraft 服务器！"
      delay: 2
    - message: "&e你好，{PLAYER}！我是服务器的智能助手。"
      delay: 4
    - message: "&b让我来帮助你快速了解服务器的基本功能吧！"
      delay: 6
    - message: "&6&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      delay: 8

  # 教学引导步骤
  # 这些消息会在玩家加入后逐步发送
  tutorial_steps:
    step_1:
      title: "&a&l【第一步】基础命令"
      delay: 10
      messages:
        - "&7▸ &f/spawn &7- 回到出生点"
        - "&7▸ &f/sethome [名称] &7- 设置家的位置"
        - "&7▸ &f/home [名称] &7- 传送到你的家"
        - "&7▸ &f/tpa <玩家名> &7- 请求传送到其他玩家"
        - "&7▸ &f/back &7- 返回上一个位置"

    step_2:
      title: "&b&l【第二步】新手礼包"
      delay: 25
      messages:
        - "&e你已经获得了基础工具包！"
        - "&7如果需要更多帮助，可以使用："
        - "&7▸ &f/kit welcome &7- 领取新手礼包（仅一次）"
        - "&7▸ &f/kit tools &7- 领取工具包（冷却10秒）"

    step_3:
      title: "&d&l【第三步】保护你的领地"
      delay: 40
      messages:
        - "&6服务器安装了 GriefPrevention 领地保护插件"
        - "&7▸ 使用 &f金铲子 &7右键点击两个对角来圈地"
        - "&7▸ &f/abandonclaim &7- 删除你所在的领地"
        - "&7▸ &f/trust <玩家名> &7- 信任玩家可以使用你的领地"
        - "&7▸ &f/untrust <玩家名> &7- 取消信任"
        - "&7▸ &f/claimslist &7- 查看你的所有领地"

    step_4:
      title: "&c&l【第四步】社交与互动"
      delay: 55
      messages:
        - "&a服务器支持多种社交功能："
        - "&7▸ &f/msg <玩家名> <消息> &7- 私聊其他玩家"
        - "&7▸ &f/r <消息> &7- 快速回复上一个私聊"
        - "&7▸ &f/sit &7- 坐下休息"
        - "&7▸ &f/lay &7- 躺下"
        - "&e&l加入我们的 QQ 群：&f539136479"

    step_5:
      title: "&5&l【第五步】其他实用功能"
      delay: 70
      messages:
        - "&6更多实用命令："
        - "&7▸ &f/suicide &7- 自杀（慎用）"
        - "&7▸ &f/warp &7- 查看可用的传送点"
        - "&7▸ &f/help &7- 查看帮助信息"
        - "&7▸ &f/rules &7- 查看服务器规则"

    step_6:
      title: "&2&l【完成】开始你的冒险！"
      delay: 85
      messages:
        - "&a&l✔ 新手教程已完成！"
        - "&e现在你可以开始探索这个世界了！"
        - "&b记住：友善待人，遵守规则，享受游戏！"
        - "&d如果遇到问题，随时使用 &f/help &d查看帮助"
        - "&6&l祝你游戏愉快！ &c❤"
        - "&6&l━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

# 定期提示消息（针对新玩家）
# 这些消息会在玩家游戏过程中定期发送
periodic_tips:
  enabled: true
  # 玩家必须在线多少秒才算"新玩家"（默认2小时）
  newbie_duration: 7200
  # 提示间隔（秒）
  interval: 300
  # 提示消息列表
  tips:
    - "&a&l[小提示] &7使用 &f/sethome &7可以设置多个家的位置哦！"
    - "&a&l[小提示] &7记得使用金铲子圈地保护你的建筑！"
    - "&a&l[小提示] &7使用 &f/tpa &7可以请求传送到其他玩家身边。"
    - "&a&l[小提示] &7服务器每30分钟会清理一次地面物品，记得及时收集！"
    - "&a&l[小提示] &7遇到问题？加入 QQ 群 539136479 寻求帮助！"
    - "&a&l[小提示] &7使用 &f/sit &7可以坐在任何地方休息。"
    - "&a&l[小提示] &7使用 &f/back &7可以返回上一个位置，死亡后也能用！"
    - "&a&l[小提示] &7使用 &f/trust <玩家名> &7可以让朋友在你的领地建造。"

# 互动式帮助系统
# 玩家可以通过命令触发特定的帮助信息
interactive_help:
  enabled: true
  # 自定义命令别名
  commands:
    guide:
      description: "显示新手指引菜单"
      permission: "essentials.guide"
      messages:
        - "&6&l━━━ &e&l新手指引菜单 &6&l━━━"
        - "&a1. &f基础命令 &7- 输入 &f/guide commands"
        - "&a2. &f领地保护 &7- 输入 &f/guide claim"
        - "&a3. &f社交功能 &7- 输入 &f/guide social"
        - "&a4. &f服务器规则 &7- 输入 &f/rules"
        - "&a5. &f常见问题 &7- 输入 &f/guide faq"
        - "&6&l━━━━━━━━━━━━━━━━━━━━"

    "guide commands":
      description: "显示基础命令帮助"
      messages:
        - "&b&l━━━ 基础命令 ━━━"
        - "&e传送命令："
        - "&7▸ &f/spawn &7- 回到出生点"
        - "&7▸ &f/sethome [名称] &7- 设置家"
        - "&7▸ &f/home [名称] &7- 回家"
        - "&7▸ &f/tpa <玩家> &7- 请求传送"
        - "&7▸ &f/back &7- 返回上一位置"
        - "&e实用命令："
        - "&7▸ &f/kit &7- 查看可用礼包"
        - "&7▸ &f/warp &7- 查看传送点"
        - "&7▸ &f/help &7- 查看帮助"

    "guide claim":
      description: "显示领地保护帮助"
      messages:
        - "&d&l━━━ 领地保护 ━━━"
        - "&e如何圈地："
        - "&71. 手持 &6金铲子"
        - "&72. 右键点击第一个角"
        - "&73. 右键点击对角位置"
        - "&e领地命令："
        - "&7▸ &f/abandonclaim &7- 删除领地"
        - "&7▸ &f/trust <玩家> &7- 信任玩家"
        - "&7▸ &f/untrust <玩家> &7- 取消信任"
        - "&7▸ &f/claimslist &7- 查看领地列表"
        - "&c注意：初始玩家有限的圈地方块数！"

    "guide social":
      description: "显示社交功能帮助"
      messages:
        - "&a&l━━━ 社交功能 ━━━"
        - "&e聊天命令："
        - "&7▸ &f/msg <玩家> <消息> &7- 私聊"
        - "&7▸ &f/r <消息> &7- 回复私聊"
        - "&e动作命令："
        - "&7▸ &f/sit &7- 坐下"
        - "&7▸ &f/lay &7- 躺下"
        - "&e其他："
        - "&7▸ &f/list &7- 查看在线玩家"
        - "&7▸ &f/near &7- 查看附近玩家"
        - "&b&l加入 QQ 群：&f539136479"

    "guide faq":
      description: "常见问题解答"
      messages:
        - "&6&l━━━ 常见问题 ━━━"
        - "&eQ: 如何保护我的建筑？"
        - "&aA: 使用金铲子圈地，详见 /guide claim"
        - ""
        - "&eQ: 多久清理一次地面物品？"
        - "&aA: 服务器每30分钟自动清理一次"
        - ""
        - "&eQ: 如何获得更多圈地方块？"
        - "&aA: 在线游戏时间越长，圈地方块越多"
        - ""
        - "&eQ: 可以和朋友一起建造吗？"
        - "&aA: 可以！使用 /trust <玩家名> 信任你的朋友"
        - ""
        - "&eQ: 遇到问题怎么办？"
        - "&aA: 加入 QQ 群 539136479 寻求帮助"

# 服务器规则
server_rules:
  - "&c&l━━━━━━ 服务器规则 ━━━━━━"
  - "&61. &f禁止使用任何作弊、外挂或恶意客户端"
  - "&62. &f禁止恶意破坏他人建筑或领地"
  - "&63. &f禁止辱骂、骚扰其他玩家"
  - "&64. &f禁止利用游戏漏洞获取不当利益"
  - "&65. &f禁止建造过于卡服的红石机器"
  - "&66. &f禁止在公共区域乱建、乱挖"
  - "&67. &f尊重他人，友善交流"
  - "&68. &f遵守管理员的指示"
  - "&c&l违反规则将受到警告、封禁等处罚！"
  - "&a&l遵守规则，共建和谐服务器！"
  - "&c&l━━━━━━━━━━━━━━━━━━━━━━"
